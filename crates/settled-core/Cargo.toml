[package]
name = "settled-core"
version = "0.1.0"
edition = "2021"

[dependencies]
sha2 = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core"] }
thiserror = "1"

[dev-dependencies]
serde_json = "1"
hex = "0.4"
proptest = "1"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "verifier"
harness = false
