[package]
name = "settled-check"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "settled-check"
path = "src/main.rs"

[dependencies]
settled-sdk = { path = "../../sdks/rust" }
tokio       = { version = "1", features = ["full"] }
anyhow      = "1"
clap        = { version = "4", features = ["derive"] }
hex         = "0.4"
tracing     = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
