[package]
name = "settled-check"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "settled-check"
path = "src/main.rs"

[dependencies]
settled-core    = { path = "../settled-core" }
settled-client  = { path = "../settled-client" }
tokio           = { version = "1", features = ["full"] }
anyhow          = "1"
clap            = { version = "4", features = ["derive"] }
ed25519-dalek   = "2"
hex             = "0.4"
serde           = { version = "1", features = ["derive"] }
serde_json      = "1"
tracing         = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
