[package]
name = "settled-server"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "settled-server"
path = "src/main.rs"

[dependencies]
settled-core    = { path = "../settled-core" }
settled-storage = { path = "../settled-storage" }
tonic           = "0.12"
prost           = "0.13"
tokio           = { version = "1", features = ["full"] }
ed25519-dalek   = { version = "2", features = ["rand_core"] }
rand            = "0.8"
thiserror       = "1"
anyhow          = "1"
hex             = "0.4"
clap            = { version = "4", features = ["derive", "env"] }
tracing         = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
axum            = "0.7"
serde           = { version = "1", features = ["derive"] }
serde_json      = "1"
prometheus      = { version = "0.13", features = ["process"] }
lazy_static     = "1"

[dev-dependencies]
tempfile     = "3"
tower        = { version = "0.4", features = ["util"] }
urlencoding  = "2"
tokio-stream = { version = "0.1", features = ["net"] }

[build-dependencies]
tonic-build = "0.12"
