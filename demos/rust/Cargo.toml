[workspace]

[package]
name = "settled-demo-rust"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "settled-demo"
path = "src/main.rs"

[dependencies]
settled-sdk = { path = "../../sdks/rust" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal"] }
clap = { version = "4", features = ["derive"] }
hex = "0.4"
