services:

  # ── Audit log server ─────────────────────────────────────────────────────────
  settled-server:
    build:
      context: ..
      dockerfile: docker/Dockerfile.server
    image: settled-server:latest
    ports:
      - "127.0.0.1:8080:8080"  # Admin HTTP — local only
      - "50051:50051"           # gRPC — clients connect here directly
    volumes:
      - server-data:/data
    environment:
      RUST_LOG: info
    command:
      - --data-dir=/data
      - --listen=0.0.0.0:50051
      - --admin-listen=0.0.0.0:8080
      - --sth-interval-secs=60
    restart: unless-stopped

  # ── Audit explorer UI ─────────────────────────────────────────────────────────
  settled-ui:
    build:
      context: ..
      dockerfile: apps/ui/Dockerfile
    image: settled-ui:latest
    ports:
      - "3000:3000"
    environment:
      SETTLED_ADDR: settled-server:50051
      PORT: "3000"
      NODE_ENV: production
    depends_on:
      - settled-server
    restart: unless-stopped

volumes:
  server-data:
