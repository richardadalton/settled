syntax = "proto3";

package settled.v1;

// Go SDK package mapping. Affects only protoc-gen-go output; other
// language plugins ignore this option.
option go_package = "github.com/richardadalton/settled/sdks/go/client/proto;pb";

// ── Append ───────────────────────────────────────────────────────────────────

message AppendRequest {
  // Application-defined key (e.g. user ID, transaction ID).
  // Used for O(1) lookup of the most recent entry for this entity.
  // Not included in the Merkle commitment.
  bytes key  = 1;
  // Audit event payload. Opaque bytes; stored and hashed by the server.
  bytes data = 2;
}

message AppendResponse {
  // Monotonically increasing sequence number (0-based leaf index).
  uint64 seq          = 1;
  // Nanoseconds since Unix epoch at which the entry was durably appended.
  int64  timestamp_ns = 2;
  // SHA-256(0x00 || data) — the leaf hash committed to in the Merkle tree.
  bytes  leaf_hash    = 3;
  // Echo of the key from the request, for correlation in async clients.
  bytes  key          = 4;
}

// ── Get ──────────────────────────────────────────────────────────────────────

message GetRequest {
  uint64 seq = 1;
}

message Entry {
  uint64 seq          = 1;
  int64  timestamp_ns = 2;
  bytes  key          = 3;
  bytes  data         = 4;
  bytes  leaf_hash    = 5;
}

message GetResponse {
  Entry entry = 1;
}

// ── Get Latest ───────────────────────────────────────────────────────────────

message GetLatestRequest {
  // Number of most-recent entries to return. 0 is treated as 1.
  // Server caps this at an implementation-defined maximum (currently 1000);
  // requests above the cap are silently clamped.
  uint32 n = 1;
}

message GetLatestResponse {
  // Most-recent entries in newest-first order: entries[0] is the newest
  // durably-stored entry. Empty if the log has no entries yet.
  // Note: entries here reflect what is durable in storage; they may not yet
  // be sealed in the latest STH.
  repeated Entry entries = 1;
  // Total number of entries durably stored in the log. If this is greater
  // than len(entries), the response was capped and the caller can use
  // ListEntries to page through earlier entries.
  uint64 total_available = 2;
}

// ── Signed Tree Head ─────────────────────────────────────────────────────────

message SignedTreeHead {
  uint64 tree_size    = 1;
  bytes  root_hash    = 2;
  int64  timestamp_ns = 3;
  bytes  signature    = 4;
  bytes  public_key   = 5;
  uint32 key_version  = 6;
}

message GetSthRequest {
  // tree_size == 0 returns the latest signed tree head.
  uint64 tree_size = 1;
}

message GetSthResponse {
  SignedTreeHead sth = 1;
}

// ── Inclusion Proof ──────────────────────────────────────────────────────────

message InclusionProofRequest {
  uint64 seq       = 1;
  // tree_size == 0 uses the latest signed tree head.
  uint64 tree_size = 2;
}

message InclusionProofResponse {
  uint64 leaf_index = 1;
  uint64 tree_size  = 2;
  // O(log n) sibling hashes from leaf to root (RFC 6962 PATH).
  repeated bytes proof = 3;
  // The STH whose root_hash the proof verifies against.
  SignedTreeHead sth   = 4;
}

// ── Consistency Proof ────────────────────────────────────────────────────────

message ConsistencyProofRequest {
  uint64 old_size = 1;
  // new_size == 0 uses the latest signed tree head.
  uint64 new_size = 2;
}

message ConsistencyProofResponse {
  uint64 old_size = 1;
  uint64 new_size = 2;
  // O(log n) hashes proving the old tree is a prefix of the new tree (RFC 6962 PROOF).
  repeated bytes proof   = 3;
  SignedTreeHead old_sth = 4;
  SignedTreeHead new_sth = 5;
}

// ── Watch ────────────────────────────────────────────────────────────────────

message WatchRequest {
  // If > 0, replay all entries with seq >= from_seq before streaming live ones.
  // If 0, stream only entries appended after the watch is established.
  uint64 from_seq = 1;
}

// ── List Entries ─────────────────────────────────────────────────────────────

message ListEntriesRequest {
  // Inclusive lower bound. Ignored when cursor > 0.
  uint64 from_seq = 1;
  // Exclusive upper bound. 0 = no upper bound (scan to end of log).
  uint64 to_seq   = 2;
  // Pagination cursor: resume from this seq (inclusive); 0 = use from_seq.
  uint64 cursor   = 3;
  // Max entries per page. 0 treated as 50; capped at 1000.
  uint32 limit    = 4;
}

message ListEntriesResponse {
  repeated Entry entries     = 1;
  // Seq to pass as cursor in the next request. 0 = no more entries.
  uint64         next_cursor = 2;
}

// ── Get By Key ───────────────────────────────────────────────────────────────

message GetByKeyRequest {
  bytes  key    = 1;
  // Resume from this sequence number (inclusive). 0 = start from the beginning.
  uint64 cursor = 2;
  // Maximum entries to return per page. 0 treated as 50; capped at 1000.
  uint32 limit  = 3;
}

message GetByKeyResponse {
  repeated Entry entries     = 1;
  // Seq to pass as cursor in the next request. 0 means no more entries.
  uint64         next_cursor = 2;
}

// ── Service ──────────────────────────────────────────────────────────────────

service SettledLog {
  // Append a new audit entry. Returns the assigned sequence number and leaf hash.
  rpc Append(AppendRequest) returns (AppendResponse);

  // Retrieve a single entry by sequence number.
  rpc Get(GetRequest) returns (GetResponse);

  // Retrieve the most-recent N entries (newest first). n == 0 is treated as 1.
  // Returns durably-stored entries; they may not yet be sealed in the latest STH.
  rpc GetLatest(GetLatestRequest) returns (GetLatestResponse);

  // Stream entries as they are appended. from_seq > 0 replays history first,
  // then continues live. from_seq == 0 streams only future appends.
  // The stream stays open until the client cancels it.
  rpc Watch(WatchRequest) returns (stream Entry);

  // Retrieve a seq-ordered page of entries within [from_seq, to_seq).
  // cursor overrides from_seq for subsequent pages; next_cursor == 0 means done.
  rpc ListEntries(ListEntriesRequest) returns (ListEntriesResponse);

  // Retrieve all entries for a given key, newest-to-oldest within the log, with
  // cursor-based pagination. cursor == 0 starts from the beginning of the log.
  // next_cursor == 0 in the response means no further pages exist.
  rpc GetByKey(GetByKeyRequest) returns (GetByKeyResponse);

  // Retrieve a Signed Tree Head. tree_size == 0 returns the latest.
  rpc GetSth(GetSthRequest) returns (GetSthResponse);

  // Return an inclusion proof for a given entry against a tree size.
  rpc InclusionProof(InclusionProofRequest) returns (InclusionProofResponse);

  // Return a consistency proof between two tree sizes.
  rpc ConsistencyProof(ConsistencyProofRequest) returns (ConsistencyProofResponse);
}
