plugins {
    id 'java-library'
    id 'com.google.protobuf' version '0.9.4'
    id 'com.vanniktech.maven.publish' version '0.29.0'
    id 'signing'
}

group = 'io.github.richardadalton'
version = '0.1.0'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
}

def grpcVersion = '1.64.0'
def protobufVersion = '3.25.3'

dependencies {
    implementation "io.grpc:grpc-protobuf:${grpcVersion}"
    implementation "io.grpc:grpc-stub:${grpcVersion}"
    implementation "io.grpc:grpc-netty-shaded:${grpcVersion}"
    implementation "com.google.protobuf:protobuf-java:${protobufVersion}"
    compileOnly 'javax.annotation:javax.annotation-api:1.3.2'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'com.fasterxml.jackson.core:jackson-databind:2.17.0'
}

sourceSets {
    main {
        proto {
            srcDirs = ['../../proto']
        }
    }
}

protobuf {
    protoc {
        artifact = "com.google.protobuf:protoc:${protobufVersion}"
    }
    plugins {
        grpc {
            artifact = "io.grpc:protoc-gen-grpc-java:${grpcVersion}"
        }
    }
    generateProtoTasks {
        all()*.plugins {
            grpc {}
        }
    }
}

test {
    useJUnitPlatform()
}

signing {
    useGpgCmd()
}

mavenPublishing {
    publishToMavenCentral(com.vanniktech.maven.publish.SonatypeHost.CENTRAL_PORTAL)
    signAllPublications()

    coordinates('io.github.richardadalton', 'settled-sdk', '0.1.0')

    pom {
        name = 'Settled SDK'
        description = 'Java SDK for the Settled tamper-evident audit log — gRPC client and RFC 6962 Merkle proof verifier.'
        url = 'https://github.com/richardadalton/settled'
        inceptionYear = '2025'

        licenses {
            license {
                name = 'Apache License, Version 2.0'
                url = 'https://www.apache.org/licenses/LICENSE-2.0'
            }
        }

        developers {
            developer {
                id = 'richardadalton'
                name = 'Richard Dalton'
                email = 'richard@devjoy.com'
            }
        }

        scm {
            connection = 'scm:git:git://github.com/richardadalton/settled.git'
            developerConnection = 'scm:git:ssh://github.com/richardadalton/settled.git'
            url = 'https://github.com/richardadalton/settled'
        }
    }
}
