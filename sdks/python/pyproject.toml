[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "settled-sdk"
version = "0.1.0"
description = "Python SDK for the Settled tamper-evident audit log"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=42.0.0",
    "grpcio>=1.62.0",
    "grpcio-tools>=1.62.0",
    "protobuf>=4.25.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/settled"]

[tool.pytest.ini_options]
testpaths = ["tests"]
